<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6366f1">
<title>TaalSter - Afrikaans Leer App</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ind:#6366f1;--ind-d:#4f46e5;--ind-l:#eef2ff;--grn:#22c55e;--grn-l:#dcfce7;--red:#ef4444;--red-l:#fee2e2;--amb:#f59e0b;--amb-l:#fef3c7;--tel:#14b8a6;--pur:#a855f7;--org:#f97316;--bg:#f0f4ff;--card:#fff;--txt:#1e1b4b;--mut:#64748b;--bor:#e0e7ff}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--txt)}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.15)}
#hdr{background:var(--ind);padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:'Baloo 2',sans-serif;font-size:21px;font-weight:800;color:#fff;display:flex;align-items:center;gap:6px}
.logo-s{animation:spin 4s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.hchip{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.35);padding:4px 10px;border-radius:20px;color:#fff;font-size:12px;font-weight:800;margin-left:6px}
#pbar{background:#fff;border-bottom:2px solid var(--bor);padding:9px 16px;display:flex;align-items:center;gap:11px;flex-shrink:0}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--ind),var(--pur));display:flex;align-items:center;justify-content:center;font-size:21px;border:3px solid var(--ind);cursor:pointer;flex-shrink:0;transition:transform .2s}
.av:active{transform:scale(.88)}
.pmeta{flex:1;min-width:0}
.pname{font-weight:800;font-size:13px}
.lvrow{display:flex;align-items:center;gap:5px;margin-top:3px}
.lvbadge{background:var(--ind);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px;flex-shrink:0}
.lvbar{flex:1;height:6px;background:var(--bor);border-radius:3px;overflow:hidden}
.lvfill{height:100%;background:linear-gradient(90deg,var(--ind),var(--pur));border-radius:3px;transition:width .5s}
.lvtxt{font-size:10px;font-weight:800;color:var(--ind);flex-shrink:0}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#nav{background:#fff;border-top:2px solid var(--bor);display:flex;justify-content:space-around;padding:7px 0 5px;flex-shrink:0}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 6px;border-radius:11px;color:var(--mut);font-size:9px;font-weight:800;border:none;background:none;min-width:44px;transition:all .15s;font-family:'Nunito',sans-serif}
.nb.on,.nb:hover{color:var(--ind);background:var(--ind-l)}
.ni{font-size:18px;line-height:1}
.scr{display:none;padding:13px 15px 18px;animation:fi .22s ease}
.scr.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes bop{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#s-pw{position:absolute;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:linear-gradient(135deg,#6366f1,#a855f7)}
.pw-wrap{background:#fff;border-radius:20px;padding:1.75rem;width:100%;max-width:340px}
.pw-icon{font-size:3.5rem;display:block;text-align:center;margin-bottom:.5rem}
.pw-title{font-family:'Baloo 2',sans-serif;font-size:1.7rem;font-weight:800;color:var(--ind);text-align:center;margin-bottom:.25rem}
.pw-sub{color:var(--mut);font-size:.85rem;text-align:center;margin-bottom:1.2rem;line-height:1.5}
.pw-inp{width:100%;background:#f8faff;border:2px solid var(--bor);border-radius:12px;padding:12px 14px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;outline:none;margin-bottom:.75rem;text-align:center;letter-spacing:.1em;color:var(--txt)}
.pw-inp:focus{border-color:var(--ind)}
.pw-inp.err{border-color:var(--red);background:var(--red-l);animation:shk .4s ease}
.pw-btn{width:100%;background:linear-gradient(135deg,var(--ind),var(--pur));color:#fff;border:none;padding:13px;border-radius:50px;font-family:'Baloo 2',sans-serif;font-size:1.1rem;font-weight:800;cursor:pointer;margin-bottom:.75rem}
.pw-btn:hover{opacity:.9}
.pw-err{color:var(--red);font-size:.82rem;font-weight:700;margin-bottom:.75rem;display:none;text-align:center}
.pw-err.show{display:block}
.pw-demo{color:var(--tel);font-size:.78rem;cursor:pointer;text-decoration:underline;display:block;text-align:center;margin-bottom:1rem}
.pw-paystack{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:1rem}
.pw-pay-t{font-family:'Baloo 2',sans-serif;font-size:.95rem;color:#16a34a;font-weight:800;margin-bottom:.3rem}
.pw-pay-s{font-size:.76rem;color:var(--mut);line-height:1.5;margin-bottom:.75rem}
.pw-pay-btn{display:block;background:linear-gradient(135deg,var(--tel),var(--grn));color:#fff;border:none;padding:10px 20px;border-radius:50px;font-family:'Baloo 2',sans-serif;font-size:.9rem;font-weight:800;cursor:pointer;text-decoration:none;text-align:center;width:100%}
.stit{font-family:'Baloo 2',sans-serif;font-size:15px;font-weight:800;color:var(--txt);margin:14px 0 9px;display:flex;align-items:center;gap:5px}
.sec-hd{font-family:'Baloo 2',sans-serif;font-size:.75rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.8rem}
.wvd{background:linear-gradient(135deg,var(--ind),var(--pur));border-radius:17px;padding:17px;color:#fff;margin-bottom:13px;position:relative;overflow:hidden}
.wvd::after{content:'✨';position:absolute;right:14px;top:12px;font-size:34px;opacity:.22}
.wvd-l{font-size:10px;letter-spacing:1px;opacity:.78;font-weight:800;text-transform:uppercase}
.wvd-w{font-family:'Baloo 2',sans-serif;font-size:26px;font-weight:800;margin:3px 0 2px}
.wvd-d{font-size:13px;opacity:.9;line-height:1.5}
.wvd-e{font-size:11px;opacity:.7;margin-top:4px;font-style:italic}
.topic-list{display:flex;flex-direction:column;gap:.7rem;margin-bottom:1rem}
.tbtn{display:flex;align-items:stretch;width:100%;border:none;cursor:pointer;border-radius:15px;overflow:hidden;transition:transform .18s,box-shadow .18s;text-align:left;padding:0;background:none}
.tbtn:hover{transform:translateY(-2px) scale(1.01)}
.tbtn:active{transform:scale(.98)}
.tb-slab{width:68px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:.5rem .3rem;min-height:76px}
.tb-slab-icon{font-size:1.9rem;line-height:1}
.tb-slab-ex{font-size:.58rem;font-weight:700;color:rgba(255,255,255,.8);text-align:center}
.tb-body{flex:1;background:var(--card);padding:.85rem .95rem;display:flex;flex-direction:column;justify-content:center;min-height:76px}
.tb-nm{font-family:'Baloo 2',sans-serif;font-size:1.05rem;font-weight:800;margin-bottom:3px}
.tb-desc{font-size:.74rem;color:var(--mut);line-height:1.35;margin-bottom:5px}
.tb-foot{display:flex;align-items:center;justify-content:space-between}
.tb-stars{font-size:.8rem;letter-spacing:1px}
.tb-arr{font-size:1.2rem;color:rgba(0,0,0,.2)}
.ai-badge{background:linear-gradient(135deg,var(--tel),var(--grn));color:#fff;font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:8px;margin-left:5px;vertical-align:middle}
